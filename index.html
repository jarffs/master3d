<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Cookie Cutter Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <header>
          <h1>CookieMaker 3D</h1>
          <p>Crie cortadores a partir de SVGs</p>
        </header>

        <div class="control-group">
          <label for="svg-upload" class="upload-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Carregar Arquivo SVG
          </label>
          <input type="file" id="svg-upload" accept=".svg" hidden />
          <div id="file-name" class="file-name">Nenhum arquivo selecionado</div>
        </div>

        <div class="settings">
          <h2>Configurações do Cortador</h2>
          
          <div class="slider-group">
            <div class="slider-header">
              <label for="height-slider">Altura do Cortador (Z)</label>
              <span id="height-val">15 mm</span>
            </div>
            <input type="range" id="height-slider" min="5" max="30" value="15" step="1" />
          </div>

          <div class="slider-group">
            <div class="slider-header">
              <label for="wall-slider">Espessura da Parede de Corte</label>
              <span id="wall-val">1.2 mm</span>
            </div>
            <input type="range" id="wall-slider" min="0.4" max="3" value="1.2" step="0.1" />
          </div>
          
          <div class="slider-group">
            <div class="slider-header">
              <label for="base-width-slider">Largura da Borda (Estabilidade)</label>
              <span id="base-width-val">4 mm</span>
            </div>
            <input type="range" id="base-width-slider" min="0" max="10" value="4" step="0.5" />
          </div>

          <div class="slider-group">
            <div class="slider-header">
              <label for="base-height-slider">Altura da Borda</label>
              <span id="base-height-val">1.5 mm</span>
            </div>
            <input type="range" id="base-height-slider" min="0" max="5" value="1.5" step="0.1" />
          </div>
        </div>

        <button id="download-btn" class="primary-btn" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Exportar STL
        </button>
      </aside>

      <main class="viewer-container">
        <div id="viewer-overlay" class="viewer-overlay">
          <p>Faça upload de um SVG para começar</p>
        </div>
        <div id="canvas-container"></div>
      </main>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
